[package]
name = "tmdb-rs"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Async, fully-typed TMDB (API v3 + v4) client with compile-time append_to_response"
keywords = ["tmdb", "api", "client", "movies", "series"]
categories = ["api-bindings"]
documentation = "https://docs.rs/tmdb-rs"
repository = "https://github.com/Hunam6/tmdb-rs"
exclude = [".github/", ".cargo/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
stream = ["dep:futures-core"]
v4 = []

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "macros"] }
paste = "1"
isolang = { version = "2", features = ["serde"] }
isocountry = "0.3"
strum = { version = "0.27", features = ["derive"] }
num_enum = "0.7"
tokio = { version = "1", features = ["time"] }
futures-core = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
futures-util = "0.3"
